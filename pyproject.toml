[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-lens"
dynamic = ["version"]
description = "Local-first usage, prompt cache, and quota observatory for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["websockets>=13,<17"]

[project.scripts]
codex-lens = "codex_lens.cli:main"

[project.urls]
Repository = "https://github.com/xukp20/codex-lens"

[tool.setuptools.dynamic]
version = { attr = "codex_lens.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_lens = ["web/*", "*.json"]
